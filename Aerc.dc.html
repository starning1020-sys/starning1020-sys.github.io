<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>STARNING：AERC 亞洲機器人運動競技大賽</title>
<script src="./react.js"></script>
<script src="./react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;family=Noto+Sans+TC:wght@400;500;700&amp;family=Noto+Serif+TC:wght@600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#060818}
a{color:#EEF0FF}a:hover{color:#C9CEF0}
</style>
</helmet>
<div style="font-family: 'Space Grotesk', 'Noto Sans TC', system-ui, sans-serif; color: #EEF0FF; background: #060818; min-height: 100vh">

<header style="border-bottom: 1px solid #1A1F42">
<nav style="max-width: 1200px; margin: 0 auto; padding: 20px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<a href="index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.5" stroke-linejoin="round"><path d="M12 2l2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2z"></path></svg>
<span style="font-size: 20px; font-weight: 700; letter-spacing: 0.12em">STARNING</span></a>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 20px">
<a href="index.html" style="font-size: 15px; text-decoration: none; padding: 10px 0">{{t.back}}</a>
<div role="group" aria-label="語言 Language" style="display: flex; gap: 4px; padding: 3px; border: 1px solid #2A3166; border-radius: 999px; background: #0B0F28">
<button type="button" onClick="{{toZh}}" aria-pressed="{{zhPressed}}" style="{{zhBtn}}">中文</button>
<button type="button" onClick="{{toEn}}" aria-pressed="{{enPressed}}" style="{{enBtn}}">EN</button>
</div>
</div>
</nav>
</header>

<section style="max-width: 1200px; margin: 0 auto; padding: 80px 24px 48px; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<span style="padding: 6px 12px; border: 1px solid #2A3166; background: #0B0F28; border-radius: 999px; font-size: 14px; color: {{accent}}">{{t.tag}}</span>
<span style="display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border: 1px solid #2A3166; background: #0B0F28; border-radius: 999px; font-size: 14px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #EEF0FF"></span>STARNING</span>
<span style="padding: 6px 12px; border: 1px solid #FFD38A; border-radius: 999px; font-size: 14px; color: #FFD38A">{{t.status}}</span>
</div>
<h1 style="margin: 0; font-size: clamp(40px, 6vw, 80px); line-height: 1.12; letter-spacing: -0.03em; font-weight: 700">{{t.title}}</h1>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #C9CEF0; max-width: 820px">{{t.intro}}</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px 32px; padding-top: 28px; border-top: 1px solid #1F2550">
<sc-for list="{{meta}}" as="m" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; color: #A3A9CF">{{m.k}}</span><span style="font-size: 16px; font-weight: 500; line-height: 1.5">{{m.v}}</span></div>
</sc-for>
</div>
</section>

<div style="max-width: 1200px; margin: 0 auto; padding: 0 24px">
<div style="aspect-ratio: 16 / 9; border: 1.5px dashed #2F366A; border-radius: 6px; background: #0A0D24; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center">
<svg aria-hidden="true" width="56" height="56" viewBox="0 0 56 56" fill="none" stroke="{{accent}}" stroke-width="1.5"><rect x="12" y="18" width="32" height="24" rx="6"></rect><circle cx="22" cy="30" r="3"></circle><circle cx="34" cy="30" r="3"></circle><line x1="28" y1="18" x2="28" y2="10"></line><circle cx="28" cy="8" r="2"></circle><line x1="12" y1="30" x2="6" y2="30"></line><line x1="44" y1="30" x2="50" y2="30"></line></svg>
<span style="font-size: 16px; color: #A3A9CF">{{t.photoTodo}}</span>
</div>
</div>

<section style="max-width: 1200px; margin: 0 auto; padding: 96px 24px; display: flex; flex-direction: column; gap: 64px">
<sc-for list="{{sections}}" as="s" hint-placeholder-count="5">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 24px 64px">
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; letter-spacing: 0.2em; color: {{accent}}">{{s.n}}</span><h2 style="margin: 0; font-size: 28px; letter-spacing: -0.02em; font-weight: 700">{{s.h}}</h2></div>
<p style="margin: 0; font-size: 18px; line-height: 1.8; grid-column: span 2; min-width: 0; color: #C9CEF0">{{s.p}}</p>
</div>
</sc-for>
</section>

<section style="border-top: 1px solid #1A1F42; background: #03040D">
<a href="{{nextHref}}" style="max-width: 1200px; margin: 0 auto; padding: 64px 24px 96px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; text-decoration: none; color: #EEF0FF">
<span style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; color: #A3A9CF">{{t.nextK}}</span>
<span style="font-size: clamp(28px, 4vw, 48px); font-weight: 700; letter-spacing: -0.03em">{{t.nextV}}</span>
</span>
<span style="font-size: 32px; color: {{accent}}" aria-hidden="true">→</span>
</a>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#9DB4FF","options":["#9DB4FF","#C9A8FF","#FFD38A","#7EE6D6"]},"startLang":{"editor":"enum","default":"zh","options":["zh","en"]},"$preview":{"width":1440,"height":3400}}'>
class Component extends DCLogic {
  state = { lang: null };
  renderVals() {
    const accent = this.props.accent ?? '#9DB4FF';
    const isEn = (this.state.lang || this.props.startLang || 'zh') === 'en';
    const L = (zh, en) => (isEn ? en : zh);
    const tbase = 'font: inherit; font-size: 13px; font-weight: 500; padding: 6px 12px; min-height: 44px; min-width: 52px; border-radius: 999px; border: none; cursor: pointer;';
    const onStyle = tbase + ' background: ' + accent + '; color: #060818;';
    const offStyle = tbase + ' background: transparent; color: #EEF0FF;';
    return {
      accent, nextHref: 'Ling.dc.html',
      toZh: () => this.setState({ lang: 'zh' }),
      toEn: () => this.setState({ lang: 'en' }),
      zhPressed: isEn ? 'false' : 'true', enPressed: isEn ? 'true' : 'false',
      zhBtn: isEn ? offStyle : onStyle, enBtn: isEn ? onStyle : offStyle,
      t: {
        back: L('← 回到所有作品', '← All works'),
        tag: L('機器人競賽', 'Robotics competition'),
        status: L('準備中', 'Preparing'),
        title: L('AERC 亞洲機器人運動競技大賽', 'AERC Asia Robot Sports Competition'),
        intro: L('[用一兩句話介紹 AERC：比賽項目、任務與組別。]', '[Introduce AERC in a sentence or two: events, tasks and division.]'),
        photoTodo: L('機器人照片／比賽現場照片（待補）', 'Robot / competition photos (coming soon)'),
        nextK: L('下一件作品', 'Next work'),
        nextV: L('〈菱光倚影〉', 'Caltrop Light & Shade')
      },
      meta: [
        { k: L('團隊', 'Team'), v: L('STARNING｜曹瑜耘、陳秉彥', 'STARNING · Yuyun Tsao, Bingyan Chen') },
        { k: L('類別', 'Category'), v: L('機器人', 'Robotics') },
        { k: L('年份', 'Year'), v: '2026' },
        { k: L('狀態', 'Status'), v: L('準備中', 'Preparing') }
      ],
      sections: [
        { n: '01', h: L('比賽任務', 'The challenge'), p: L('[這次比賽要機器人完成什麼任務？規則和得分方式是什麼？]', '[What does the robot have to do? What are the rules and scoring?]') },
        { n: '02', h: L('我們的機器人', 'Our robot'), p: L('[機器人的結構、感測器、程式邏輯與設計巧思。]', '[Structure, sensors, code logic and design ideas.]') },
        { n: '03', h: L('團隊分工', 'Who did what'), p: L('[每個人負責的部分。]', '[What each member worked on.]') },
        { n: '04', h: L('過程與困難', 'Process & challenges'), p: L('[準備過程中遇到的問題，以及怎麼解決。]', '[Problems you ran into and how you solved them.]') },
        { n: '05', h: L('成果與收穫', 'Results & takeaways'), p: L('[比賽結果，以及學到什麼。]', '[The result, and what you learned.]') }
      ]
    };
  }
}
</script>
</body>
</html>
