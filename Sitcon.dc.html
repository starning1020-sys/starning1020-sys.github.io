<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>STARNING：SITCON 2027 Demo 展</title>
<script src="./react.js"></script>
<script src="./react-dom.js"></script>
<script src="./support.js"></script>
<script>
(function(){var d=document.documentElement;
addEventListener('pageshow',function(){d.classList.remove('pg-leave')});
document.addEventListener('click',function(e){
if(e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;
var a=e.target&&e.target.closest&&e.target.closest('a[href]');if(!a)return;
if((a.target&&a.target!=='_self')||a.hasAttribute('download'))return;
var u;try{u=new URL(a.href,location.href)}catch(_){return}
if(u.origin!==location.origin||!/\.html$|\/$/.test(u.pathname))return;
if(u.pathname===location.pathname&&u.search===location.search)return;
if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
e.preventDefault();d.classList.add('pg-leave');setTimeout(function(){location.href=a.href},300);
});})();
</script>
<script>
(function(){try{
var path=location.pathname,key='sy:'+path,done=false,t0=Date.now();
function stop(){done=true}
['wheel','touchstart','keydown','mousedown'].forEach(function(t){addEventListener(t,stop,{once:true,passive:true})});
addEventListener('pagehide',function(){try{sessionStorage.setItem(key,String(scrollY))}catch(_){}});
var nav=(performance.getEntriesByType&&performance.getEntriesByType('navigation')[0]||{}).type;
var id=location.hash.length>1?decodeURIComponent(location.hash.slice(1)):'';
var saved=null;try{saved=+sessionStorage.getItem(key)}catch(_){}
if(!id&&!(nav==='reload'&&saved>0))return;
if('scrollRestoration' in history)history.scrollRestoration='manual';
function go(){
 if(id){var el=document.getElementById(id);if(el&&el.getBoundingClientRect().height>0){el.scrollIntoView({block:'start'});return true}}
 else if(document.documentElement.scrollHeight>=saved+innerHeight*0.5){scrollTo(0,saved);return true}
 return false}
(function tick(){if(done)return;if(go()){setTimeout(function(){if(!done)go()},450);setTimeout(function(){if(!done)go()},1200);return}
 if(Date.now()-t0<5000)requestAnimationFrame(tick)})();
addEventListener('hashchange',function(){id=location.hash.length>1?decodeURIComponent(location.hash.slice(1)):''});
}catch(_){}})();
</script>
<link rel="icon" type="image/png" href="./favicon-32.png">
<link rel="apple-touch-icon" href="./apple-touch-icon-180.png">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;family=Noto+Sans+TC:wght@400;500;700&amp;family=Noto+Serif+TC:wght@600;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#060818}
a{color:#EEF0FF}a:hover{color:#C9CEF0}

/* STARNING brand light */
html::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(60vw 42vw at 88% -8%,rgba(157,180,255,.13),transparent 62%),radial-gradient(52vw 40vw at -8% 108%,rgba(201,168,255,.10),transparent 60%)}

html,body{overflow-anchor:none}

/* STARNING soft page transition */
body{animation:pgIn .7s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes pgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
html.pg-leave body{animation:pgOut .3s ease forwards}
@keyframes pgOut{to{opacity:0;transform:translateY(-6px)}}
html::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:2147483647;background:radial-gradient(46vmax 36vmax at 50% 45%,rgba(157,180,255,.20),rgba(201,168,255,.07) 45%,transparent 72%);opacity:0;transition:opacity .3s ease;animation:pgGlow 1s ease both}
html.pg-leave::after{opacity:1;animation:none}
@keyframes pgGlow{from{opacity:1}to{opacity:0}}
@media (prefers-reduced-motion:reduce){body{animation:none}html.pg-leave body{animation:none}html::after{display:none}}
</style>
</helmet>
<div style="font-family: 'Space Grotesk', 'Noto Sans TC', system-ui, sans-serif; color: #EEF0FF; background: #060818; min-height: 100vh">

<header style="border-bottom: 1px solid #1A1F42; position: relative; z-index: 2">
<nav style="max-width: 1200px; margin: 0 auto; padding: 20px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<a href="index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none">
<img src="./969d314864f4f81c57b195951742050c.svg" alt="" aria-hidden="true" width="30" height="31" style="display: block; width: 30px; height: auto; filter: drop-shadow(0 0 6px rgba(157, 180, 255, 0.75))">
<img src="./7d360e0a6d18bf591d8c97441450e22f.svg" alt="STARNING" width="126" height="34" style="display: block; height: 34px; width: auto; filter: drop-shadow(0 2px 0 rgba(74, 64, 170, 0.8)) drop-shadow(0 0 6px rgba(157, 180, 255, 0.45))"></a>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 20px">
<a href="index.html" style="font-size: 15px; text-decoration: none; padding: 10px 0">{{t.back}}</a>
<div role="group" aria-label="語言 Language" style="display: flex; gap: 4px; padding: 3px; border: 1px solid #2A3166; border-radius: 999px; background: #0B0F28">
<button type="button" onClick="{{toZh}}" aria-pressed="{{zhPressed}}" style="{{zhBtn}}">中文</button>
<button type="button" onClick="{{toEn}}" aria-pressed="{{enPressed}}" style="{{enBtn}}">EN</button>
</div>
</div>
</nav>
</header>

<section style="position: relative; overflow: hidden; border-bottom: 1px solid #1A1F42">
<svg aria-hidden="true" viewBox="0 0 1440 640" preserveAspectRatio="xMidYMid slice" style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none">
<ellipse cx="1060" cy="320" rx="420" ry="240" fill="none" stroke="#1F2550" stroke-width="2"></ellipse>
<ellipse cx="1060" cy="320" rx="300" ry="170" fill="none" stroke="#1F2550" stroke-width="1.5" stroke-dasharray="4 10"></ellipse>
<g fill="#9DB4FF" font-family="Space Grotesk, sans-serif"><text x="700" y="140" font-size="34" opacity="0.4">?</text><text x="1420" y="250" font-size="44" opacity="0.5">?</text><text x="760" y="520" font-size="28" opacity="0.35">?</text><text x="1330" y="560" font-size="38" opacity="0.45">?</text><text x="1180" y="90" font-size="26" opacity="0.3">?</text></g>
<circle cx="1420" cy="140" r="10" fill="#FFD38A"></circle>
</svg>
<div style="position: relative; max-width: 1200px; margin: 0 auto; padding: 88px 24px 72px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 32px 56px; align-items: center">
<div style="display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<span style="padding: 6px 12px; border: 1px solid #2A3166; background: #0B0F28; border-radius: 999px; font-size: 14px; color: {{accent}}">{{t.tag}}</span>
<span style="display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border: 1px solid #FFD38A; border-radius: 999px; font-size: 14px; color: #FFD38A"><span style="width: 8px; height: 8px; border-radius: 50%; background: #FFD38A"></span>{{t.status}}</span>
</div>
<h1 style="margin: 0; font-size: clamp(40px, 6vw, 72px); line-height: 1.1; letter-spacing: -0.03em; font-weight: 700">SITCON 2027<span style="display: block; font-size: 0.5em; color: #C9CEF0; letter-spacing: 0; margin-top: 8px">{{t.sub}}</span></h1>
<p style="margin: 0; font-size: 19px; line-height: 1.8; color: #C9CEF0; max-width: 560px">{{t.lead}}</p>
</div>
<div aria-hidden="true" style="justify-self: center; font-size: clamp(160px, 26vw, 320px); font-weight: 700; line-height: 0.9; letter-spacing: -0.06em; background: linear-gradient(110deg, #FFFFFF 10%, #FFD38A 90%); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 0 80px rgba(255, 211, 138, 0.25)">42</div>
</div>
</section>

<div style="max-width: 1200px; margin: 0 auto; padding: 0 24px">

<section style="padding: 56px 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 12px">
<sc-for list="{{meta}}" as="m" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 18px 20px; border-radius: 12px; background: #0E1230; border: 1px solid #252B52"><span style="font-size: 13px; color: #A3A9CF">{{m.k}}</span><span style="font-size: 17px; font-weight: 700; line-height: 1.5">{{m.v}}</span></div>
</sc-for>
</section>

<section style="padding: 72px 0; border-top: 1px solid #1A1F42; display: flex; flex-direction: column; gap: 36px">
<div style="display: flex; flex-direction: column; gap: 10px"><span style="font-size: 13px; font-weight: 700; letter-spacing: 0.2em; color: {{accent}}">01 · {{t.k1}}</span><h2 style="margin: 0; font-size: clamp(28px, 3.4vw, 40px); font-weight: 700; letter-spacing: -0.02em">{{t.h1}}</h2></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 24px 56px; align-items: start">
<div style="display: flex; flex-direction: column; gap: 16px">
<p style="margin: 0; font-size: 17px; line-height: 1.9; color: #C9CEF0">{{t.p1a}}</p>
<p style="margin: 0; font-size: 17px; line-height: 1.9; color: #C9CEF0">{{t.p1b}}</p>
</div>
<blockquote style="margin: 0; display: flex; flex-direction: column; gap: 14px; padding: 28px 30px; border-radius: 14px; background: rgba(255, 211, 138, 0.06); border-left: 4px solid #FFD38A">
<p style="margin: 0; font-family: 'Noto Serif TC', serif; font-size: clamp(20px, 2.4vw, 26px); font-weight: 600; line-height: 1.6">「{{t.quote}}」</p>
<cite style="font-style: normal; font-size: 14px; color: #A3A9CF">— {{t.cite}}</cite>
</blockquote>
</div>
<ol style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 12px">
<sc-for list="{{whys}}" as="w" hint-placeholder-count="3"><li style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 12px; background: #0E1230; border: 1px solid #252B52; border-top: 3px solid {{w.c}}"><span style="font-size: 40px; font-weight: 700; line-height: 1; color: {{w.c}}">?</span><span style="font-size: 20px; font-weight: 700">{{w.k}}</span></li></sc-for>
</ol>
</section>

<section style="padding: 72px 0; border-top: 1px solid #1A1F42; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-direction: column; gap: 10px"><span style="font-size: 13px; font-weight: 700; letter-spacing: 0.2em; color: {{accent}}">02 · {{t.k2}}</span><h2 style="margin: 0; font-size: clamp(28px, 3.4vw, 40px); font-weight: 700; letter-spacing: -0.02em">{{t.h2}}</h2></div>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 28px 30px; border-radius: 14px; border: 1.5px dashed #2F366A; background: #0A0D24">
<span style="font-size: 17px; font-weight: 700">{{t.todoK}}</span>
<span style="font-size: 15px; line-height: 1.8; color: #A3A9CF">{{t.todo}}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 13px; font-weight: 700; letter-spacing: 0.2em; color: #A3A9CF">{{t.askingK}}</span>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 12px">
<sc-for list="{{asking}}" as="a" hint-placeholder-count="2"><a href="{{a.href}}" style="display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 22px; border-radius: 12px; background: #0E1230; border: 1px solid #252B52; text-decoration: none"><span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; color: #A3A9CF">{{a.k}}</span><span style="font-size: 17px; font-weight: 700; line-height: 1.5">{{a.q}}</span></span><span aria-hidden="true" style="font-size: 22px; color: {{accent}}">→</span></a></sc-for>
</div>
</div>
</section>

</div>

<section style="border-top: 1px solid #1A1F42; background: #03040D">
<a href="Time.dc.html" style="max-width: 1200px; margin: 0 auto; padding: 64px 24px 96px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; text-decoration: none; color: #EEF0FF">
<span style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; color: #A3A9CF">{{t.nextK}}</span>
<span style="font-size: clamp(28px, 4vw, 48px); font-weight: 700; letter-spacing: -0.03em">{{t.nextV}}</span>
</span>
<span style="font-size: 32px; color: {{accent}}" aria-hidden="true">→</span>
</a>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#9DB4FF","options":["#9DB4FF","#C9A8FF","#FFD38A","#7EE6D6"]},"startLang":{"editor":"enum","default":"zh","options":["zh","en"]},"$preview":{"width":1440,"height":4200}}'>
class Component extends DCLogic {
  state = { lang: null };
  renderVals() {
    const accent = this.props.accent ?? '#9DB4FF';
    const isEn = (this.state.lang || this.props.startLang || 'zh') === 'en';
    const L = (zh, en) => (isEn ? en : zh);
    const tbase = 'font: inherit; font-size: 13px; font-weight: 500; padding: 6px 12px; min-height: 44px; min-width: 52px; border-radius: 999px; border: none; cursor: pointer;';
    const onStyle = tbase + ' background: ' + accent + '; color: #060818;';
    const offStyle = tbase + ' background: transparent; color: #EEF0FF;';
    return {
      accent,
      toZh: () => this.setState({ lang: 'zh' }),
      toEn: () => this.setState({ lang: 'en' }),
      zhPressed: isEn ? 'false' : 'true', enPressed: isEn ? 'true' : 'false',
      zhBtn: isEn ? offStyle : onStyle, enBtn: isEn ? onStyle : offStyle,
      meta: [
        { k: L('日期', 'Date'), v: '2027.03.13' },
        { k: L('地點', 'Venue'), v: L('中央研究院', 'Academia Sinica') },
        { k: L('形式', 'Format'), v: L('Demo 展', 'Demo exhibition') },
        { k: L('參與者', 'Team'), v: 'STARNING' }
      ],
      whys: [
        { k: L('為什麼想知道？', 'Why do we want to know?'), c: '#5EC8FF' },
        { k: L('為什麼相信？', 'Why do we believe?'), c: '#C9A8FF' },
        { k: L('為什麼選擇？', 'Why do we choose?'), c: '#FFD38A' }
      ],
      asking: [
        { href: 'Time.dc.html', k: L('量子時間科展', 'Quantum-time project'), q: L('如果宇宙是靜止的，時間從哪裡來？', 'If the universe stands still, where does time come from?') },
        { href: 'Brain.dc.html', k: L('腦波科展', 'Brainwave project'), q: L('生成式 AI 會怎麼改變我們思考的方式？', 'How might generative AI change the way we think?') }
      ],
      t: {
        back: L('← 回到所有作品', '← All works'),
        tag: L('資訊・Demo 展', 'Tech · Demo'),
        status: L('準備中', 'Preparing'),
        sub: L('學生計算機年會・Demo 展', 'Students’ Information Technology Conference · Demo'),
        lead: L('今年的主題是「42」——《銀河便車指南》裡，超級電腦算了七百五十萬年得出的「生命、宇宙及萬事萬物的終極答案」。只是沒有人知道，問題是什麼。', 'This year’s theme is “42”: in The Hitchhiker’s Guide to the Galaxy, a supercomputer spends 7.5 million years computing the Answer to Life, the Universe and Everything. Nobody knows what the question was.'),
        k1: L('今年的主題', 'THE THEME'),
        h1: L('答案有了，問題呢？', 'We have the answer. What’s the question?'),
        p1a: L('主題說明提到：我們懂得越多，看見的未知也越多，就像「起司越多，洞也越多」。學習不是把洞填滿，而是終於能看見那些洞。', 'The theme notes that the more we know, the more unknowns we see, like “more cheese, more holes.” Learning isn’t filling the holes, but finally being able to see them.'),
        p1b: L('而在答案越來越容易取得的今天，工具幾秒就能給出程式和文章，我們卻還沒想清楚，自己真正想問的是什麼。', 'And now that answers come easily, with code and essays in seconds, we still haven’t worked out what we really want to ask.'),
        quote: L('或許真正的關鍵，從來都不是找到答案，而是知道下一個問題是什麼。', 'Perhaps the key was never finding the answer, but knowing what the next question is.'),
        cite: L('SITCON 2027 主題說明', 'SITCON 2027 theme statement'),
        k2: L('我們的 Demo', 'OUR DEMO'),
        h2: L('我們帶去的問題', 'The question we’re bringing'),
        todoK: L('🔒 Demo 內容保密中', '🔒 Demo details are confidential'),
        todo: L('Demo 內容目前保密，2027/03/13 在中央研究院展出後公開。', 'The demo is confidential for now; it will be shared after the exhibition on 13 March 2027 at Academia Sinica.'),
        askingK: L('STARNING 正在問的其他問題', 'OTHER QUESTIONS STARNING IS ASKING'),
        nextK: L('下一件作品', 'Next work'),
        nextV: L('量子時間科展', 'Quantum-time project')
      }
    };
  }
}
</script>
</body>
</html>
