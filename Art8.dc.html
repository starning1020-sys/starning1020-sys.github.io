<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>STARNING：繪畫作品 8〈寂寥〉</title>
<script src="./react.js"></script>
<script src="./react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;family=Noto+Sans+TC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#060818}
a{color:#EEF0FF}a:hover{color:#C9CEF0}
</style>
</helmet>
<div style="font-family: 'Space Grotesk', 'Noto Sans TC', system-ui, sans-serif; color: #EEF0FF; background: #060818; min-height: 100vh">

<header style="border-bottom: 1px solid #1A1F42">
<nav style="max-width: 1200px; margin: 0 auto; padding: 20px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<a href="index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.5" stroke-linejoin="round"><path d="M12 2l2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2z"></path></svg>
<span style="font-size: 20px; font-weight: 700; letter-spacing: 0.12em">STARNING</span></a>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 20px">
<a href="index.html" style="font-size: 15px; text-decoration: none; padding: 10px 0">{{t.back}}</a>
<div role="group" aria-label="語言 Language" style="display: flex; gap: 4px; padding: 3px; border: 1px solid #2A3166; border-radius: 999px; background: #0B0F28">
<button type="button" onClick="{{toZh}}" aria-pressed="{{zhPressed}}" style="{{zhBtn}}">中文</button>
<button type="button" onClick="{{toEn}}" aria-pressed="{{enPressed}}" style="{{enBtn}}">EN</button>
</div>
</div>
</nav>
</header>

<section style="max-width: 1200px; margin: 0 auto; padding: 80px 24px 48px; display: flex; flex-direction: column; gap: 24px">
<span style="align-self: flex-start; padding: 6px 12px; border: 1px solid #2A3166; background: #0B0F28; border-radius: 999px; font-size: 14px; color: {{accent}}">{{t.tag}}</span>
<h1 style="margin: 0; font-size: clamp(40px, 6vw, 80px); line-height: 1.12; letter-spacing: -0.03em; font-weight: 700">{{t.title}}</h1>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #A3A9CF; max-width: 760px">{{t.lead}}</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 24px; padding-top: 28px; border-top: 1px solid #1F2550; max-width: 760px">
<sc-for list="{{meta}}" as="m" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; color: #A3A9CF">{{m.k}}</span><span style="font-size: 16px; font-weight: 500">{{m.v}}</span></div>
</sc-for>
</div>
</section>

<div style="max-width: 1200px; margin: 0 auto; padding: 0 24px">
<figure style="margin: 0 auto; max-width: 760px; background: #0E1230; border: 1px solid #252B52; border-radius: 6px; overflow: hidden">
<img src="{{img}}" alt="{{t.alt}}" style="display: block; width: 100%; height: auto">
</figure>
</div>

<section style="max-width: 1200px; margin: 0 auto; padding: 96px 24px; display: flex; flex-direction: column; gap: 64px">
<sc-for list="{{sections}}" as="s" hint-placeholder-count="4">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 24px 64px">
<h2 style="margin: 0; font-size: 28px; letter-spacing: -0.02em; font-weight: 700">{{s.h}}</h2>
<p style="margin: 0; font-size: 18px; line-height: 1.8; grid-column: span 2; min-width: 0; color: #C9CEF0">{{s.p}}</p>
</div>
</sc-for>
</section>

<section style="border-top: 1px solid #1A1F42; background: #03040D">
<a href="{{nextHref}}" style="max-width: 1200px; margin: 0 auto; padding: 64px 24px 96px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; text-decoration: none; color: #EEF0FF">
<span style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; color: #A3A9CF">{{t.nextK}}</span>
<span style="font-size: clamp(28px, 4vw, 48px); font-weight: 700; letter-spacing: -0.03em">{{t.nextV}}</span>
</span>
<span style="font-size: 32px; color: {{accent}}" aria-hidden="true">→</span>
</a>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#9DB4FF","options":["#9DB4FF","#C9A8FF","#FFD38A","#7EE6D6"]},"startLang":{"editor":"enum","default":"zh","options":["zh","en"]},"$preview":{"width":1440,"height":3400}}'>
class Component extends DCLogic {
  state = { lang: null };
  renderVals() {
    const accent = this.props.accent ?? '#9DB4FF';
    const isEn = (this.state.lang || this.props.startLang || 'zh') === 'en';
    const L = (zh, en) => (isEn ? en : zh);
    const tbase = 'font: inherit; font-size: 13px; font-weight: 500; padding: 6px 12px; min-height: 44px; min-width: 52px; border-radius: 999px; border: none; cursor: pointer;';
    const onStyle = tbase + ' background: ' + accent + '; color: #060818;';
    const offStyle = tbase + ' background: transparent; color: #EEF0FF;';
    const visual = L('一隻巨大的眼睛佔滿整張畫紙，虹膜的放射紋路細密，瞳孔深邃，左上方留著一點反光，四周是一層層向外伸展的睫毛。', 'A giant eye fills the whole page: fine radiating lines in the iris, a deep pupil, a glint of light at the upper left, and lashes reaching outward layer by layer.');
    return {
      accent, img: './fdd7045f3c808743936c52161b421a90.jpg',
      nextHref: 'Art9.dc.html',
      toZh: () => this.setState({ lang: 'zh' }),
      toEn: () => this.setState({ lang: 'en' }),
      zhPressed: isEn ? 'false' : 'true', enPressed: isEn ? 'true' : 'false',
      zhBtn: isEn ? offStyle : onStyle, enBtn: isEn ? onStyle : offStyle,
      t: {
        back: L('← 回到所有作品', '← All works'),
        tag: L('繪畫', 'Art'),
        title: L('〈寂寥〉', 'Solitude'),
        lead: visual,
        alt: L('鉛筆素描：佔滿畫面的巨大眼睛', 'Pencil drawing: a giant eye filling the page'),
        nextK: L('下一件作品', 'Next work'),
        nextV: L('〈超現實〉', 'Surreal')
      },
      meta: [
        { k: L('作者', 'By'), v: L('Yuyun Tsao', 'Yuyun Tsao') },
        { k: L('年份', 'Year'), v: L('2026', '2026') },
        { k: L('媒材', 'Medium'), v: L('[媒材]', '[Medium]') }
      ],
      sections: [
        { h: L('創作動機', 'Why I made it'), p: L('[是什麼讓你想畫這幅畫？]', '[What made you want to paint this?]') },
        { h: L('畫面元素', 'What’s in the picture'), p: visual },
        { h: L('最困難的地方', 'The hardest part'), p: L('[創作時遇到的困難，以及你怎麼解決。]', '[What was hard, and how you solved it.]') },
        { h: L('學到什麼・下次想改進', 'What I learned · Next time'), p: L('[這幅畫讓你學到什麼？下次想嘗試什麼？]', '[What did you learn, and what would you try next time?]') }
      ]
    };
  }
}
</script>
</body>
</html>
