<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>STARNING：〈宇宙凝縮〉（保密中）</title>
<script src="./react.js"></script>
<script src="./react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;family=Noto+Sans+TC:wght@400;500;700&amp;family=Noto+Serif+TC:wght@600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#060818}
a{color:#EEF0FF}a:hover{color:#C9CEF0}
</style>
</helmet>
<div style="font-family: 'Space Grotesk', 'Noto Sans TC', system-ui, sans-serif; color: #EEF0FF; background: #060818; min-height: 100vh">

<header style="border-bottom: 1px solid #1A1F42">
<nav style="max-width: 1200px; margin: 0 auto; padding: 20px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<a href="index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.5" stroke-linejoin="round"><path d="M12 2l2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2z"></path></svg>
<span style="font-size: 20px; font-weight: 700; letter-spacing: 0.12em">STARNING</span></a>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 20px">
<a href="index.html" style="font-size: 15px; text-decoration: none; padding: 10px 0">{{t.back}}</a>
<div role="group" aria-label="語言 Language" style="display: flex; gap: 4px; padding: 3px; border: 1px solid #2A3166; border-radius: 999px; background: #0B0F28">
<button type="button" onClick="{{toZh}}" aria-pressed="{{zhPressed}}" style="{{zhBtn}}">中文</button>
<button type="button" onClick="{{toEn}}" aria-pressed="{{enPressed}}" style="{{enBtn}}">EN</button>
</div>
</div>
</nav>
</header>

<section style="position: relative; overflow: hidden; border-bottom: 1px solid #1A1F42">
<img src="./2edebad853fc502b605cf8ca1f604afd.jpg" alt="" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.18; filter: blur(6px)">
<div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(6, 8, 24, 0.5), #060818)"></div>
<div style="position: relative; max-width: 1200px; margin: 0 auto; padding: 96px 24px 72px; display: flex; flex-direction: column; gap: 26px">
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<span style="padding: 6px 12px; border: 1px solid #2A3166; background: #0B0F28; border-radius: 999px; font-size: 14px; color: {{accent}}">{{t.tag}}</span>
<span style="display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; background: #FFD38A; color: #060818; font-size: 14px; font-weight: 700">🔒 {{t.status}}</span>
</div>
<h1 style="margin: 0; max-width: 900px; font-size: clamp(40px, 6vw, 76px); line-height: 1.15; letter-spacing: -0.02em; font-weight: 700">{{t.title}}</h1>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px 32px; padding-top: 26px; border-top: 1px solid #1F2550; max-width: 860px">
<sc-for list="{{meta}}" as="m" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; color: #A3A9CF">{{m.k}}</span><span style="font-size: 16px; font-weight: 500; line-height: 1.5">{{m.v}}</span></div>
</sc-for>
</div>
</div>
</section>

<section style="max-width: 1200px; margin: 0 auto; padding: 88px 24px 112px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 20px; padding: clamp(36px, 6vw, 72px) clamp(20px, 4vw, 48px); border-radius: 20px; border: 1.5px dashed #2F366A; background: #0A0D24; text-align: center">
<svg aria-hidden="true" width="64" height="64" viewBox="0 0 64 64" fill="none" stroke="#FFD38A" stroke-width="3" stroke-linecap="round"><rect x="14" y="28" width="36" height="26" rx="6"></rect><path d="M22 28v-8a10 10 0 0 1 20 0v8"></path><circle cx="32" cy="41" r="3.5" fill="#FFD38A"></circle></svg>
<h2 style="margin: 0; font-size: clamp(24px, 3vw, 32px); font-weight: 700">{{t.lockH}}</h2>
<p style="margin: 0; max-width: 620px; font-size: 17px; line-height: 1.8; color: #C9CEF0">{{t.lockP}}</p>
<span style="padding: 8px 18px; border-radius: 999px; border: 1px solid #2A3166; font-size: 14px; color: #A3A9CF">{{t.openWhen}}</span>
</div>
</section>

<section style="border-top: 1px solid #1A1F42; background: #03040D">
<a href="Art1.dc.html" style="max-width: 1200px; margin: 0 auto; padding: 64px 24px 96px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; text-decoration: none; color: #EEF0FF">
<span style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; color: #A3A9CF">{{t.nextK}}</span>
<span style="font-size: clamp(28px, 4vw, 48px); font-weight: 700; letter-spacing: -0.03em">{{t.nextV}}</span>
</span>
<span style="font-size: 32px; color: {{accent}}" aria-hidden="true">→</span>
</a>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#9DB4FF","options":["#9DB4FF","#C9A8FF","#FFD38A","#7EE6D6"]},"startLang":{"editor":"enum","default":"zh","options":["zh","en"]},"$preview":{"width":1440,"height":2200}}'>
class Component extends DCLogic {
  state = { lang: null };
  renderVals() {
    const accent = this.props.accent ?? '#9DB4FF';
    const isEn = (this.state.lang || this.props.startLang || 'zh') === 'en';
    const L = (zh, en) => (isEn ? en : zh);
    const tbase = 'font: inherit; font-size: 13px; font-weight: 500; padding: 6px 12px; min-height: 44px; min-width: 52px; border-radius: 999px; border: none; cursor: pointer;';
    const onStyle = tbase + ' background: ' + accent + '; color: #060818;';
    const offStyle = tbase + ' background: transparent; color: #EEF0FF;';
    return {
      accent,
      toZh: () => this.setState({ lang: 'zh' }),
      toEn: () => this.setState({ lang: 'en' }),
      zhPressed: isEn ? 'false' : 'true', enPressed: isEn ? 'true' : 'false',
      zhBtn: isEn ? offStyle : onStyle, enBtn: isEn ? onStyle : offStyle,
      meta: [
        { k: L('作者', 'By'), v: 'Yuyun Tsao' },
        { k: L('比賽', 'Competition'), v: L('鳥取漫畫比賽', 'Tottori Manga Competition') },
        { k: L('狀態', 'Status'), v: L('已投稿・結果待公布', 'Submitted · awaiting results') }
      ],
      t: {
        back: L('← 回到所有作品', '← All works'),
        tag: L('藝術創作・漫畫', 'Art · Manga'),
        status: L('結果待公布・作品保密', 'Awaiting results · confidential'),
        title: L('〈宇宙凝縮〉', 'Cosmos Condensed'),
        lockH: L('內容保密中', 'Details are confidential for now'),
        lockP: L('這件作品已投稿鳥取漫畫比賽，目前結果還沒公布。作品圖與創作內容會在結果公布後公開。', 'This piece has been entered in the Tottori Manga Competition and results are not out yet. The artwork and notes will be shared once results are announced.'),
        openWhen: L('結果公布後公開', 'Public after results are announced'),
        nextK: L('下一件作品', 'Next work'),
        nextV: L('〈日落〉', 'Sunset')
      }
    };
  }
}
</script>
</body>
</html>
